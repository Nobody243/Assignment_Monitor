<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline · Assignment Monitor</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07080d">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <style>
    /* served by the service worker when a page cannot be fetched; self-contained, nothing here needs the network */
    @font-face { font-family: "Inter"; font-style: normal; font-weight: 100 900; font-display: swap; src: url(/assets/fonts/inter-latin-wght-normal.woff2) format("woff2"); }
    @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 500; font-display: swap; src: url(/assets/fonts/jetbrains-mono-latin-500-normal.woff2) format("woff2"); }
    :root { color-scheme: dark; --ink-1: #f3f2ed; --ink-2: #cfcdc5; --ink-3: #9b9892; --accent: #fd693d; --line: rgba(243, 242, 237, 0.09); --line-2: rgba(243, 242, 237, 0.146); }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; -webkit-user-select: none; user-select: none; color: var(--ink-1); font: 400 16px/1.618 "Inter", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
      background: radial-gradient(900px 600px at 50% 115%, #0c1332 0%, #07080d 55%, #050506 100%) #07080d; overflow-x: hidden; }
    /* the planet's limb, in CSS: a wide dark disc rising from the bottom with a thin lit edge, as the hero has it.
       Its top edge sits at 26 % of the window height, and the content is centred in the space above it, so the
       words never cross the rim at any window size. */
    .limb { position: fixed; left: 50%; bottom: calc(26vh - 190vw); width: 190vw; height: 190vw; transform: translateX(-50%); border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle at 50% 38%, #0d1120 0%, #080a12 45%, #06070b 100%);
      box-shadow: 0 -2px 0 0 rgba(253, 105, 61, 0.55), 0 -18px 60px -4px rgba(253, 105, 61, 0.28), 0 -60px 160px 10px rgba(77, 192, 236, 0.1), inset 0 24px 80px -20px rgba(253, 105, 61, 0.22); }
    .limb::after { content: ""; position: absolute; inset: -14vw; border-radius: 50%; background: radial-gradient(circle at 50% 32%, rgba(77, 192, 236, 0.12), transparent 50%); }
    @media (max-width: 640px) { .limb { width: 260vw; height: 260vw; bottom: calc(22vh - 260vw); } }
    .stars { position: fixed; inset: 0; background-image: radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,0.5), transparent 60%), radial-gradient(1px 1px at 78% 12%, rgba(255,255,255,0.45), transparent 60%), radial-gradient(1.5px 1.5px at 62% 34%, rgba(255,255,255,0.55), transparent 60%), radial-gradient(1px 1px at 30% 42%, rgba(255,255,255,0.35), transparent 60%), radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,0.4), transparent 60%), radial-gradient(1.5px 1.5px at 44% 8%, rgba(255,255,255,0.5), transparent 60%), radial-gradient(1px 1px at 8% 60%, rgba(255,255,255,0.3), transparent 60%); }
    main { position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px 30vh; box-sizing: border-box; text-align: center; }
    @media (max-width: 640px) { main { padding-bottom: 26vh; } }
    /* short windows (small laptops at 125 %): the rim sits lower and the content keeps clear of it */
    @media (max-height: 700px) and (min-width: 641px) { main { padding-bottom: 22vh; } .limb { bottom: calc(18vh - 190vw); } .brand { margin-bottom: 22px; } }
    .card { max-width: 560px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: clamp(28px, 6vh, 56px); color: inherit; text-decoration: none; }
    .brand img { width: 28px; height: 28px; border-radius: 7px; }
    .mono { font-family: "JetBrains Mono", Consolas, monospace; font-weight: 500; font-size: 12.6px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin: 0 0 14px; }
    h1 { margin: 0 0 14px; font-size: clamp(32.9px, 7vw, 53.3px); line-height: 1.05; letter-spacing: -0.03em; font-weight: 700; text-wrap: balance; }
    p { margin: 0 auto; max-width: 46ch; color: var(--ink-2); font-size: clamp(16px, 1.4vw, 18px); text-wrap: pretty; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 28px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 16px 24px; border-radius: 12px; border: 1px solid transparent; font: 600 15px/1 inherit; font-family: inherit; cursor: pointer; text-decoration: none; transition: transform .45s cubic-bezier(.16,1,.3,1), background .2s; }
    .btn:hover { transform: translateY(-2px); }
    .btn-accent { background: var(--accent); color: #140905; box-shadow: 0 10px 30px -14px rgba(253, 105, 61, 0.6); }
    .btn-accent:hover { background: #ff8764; }
    .btn-ghost { color: var(--ink-1); border-color: var(--line-2); background: rgba(10, 11, 16, 0.35); }
    .status { margin-top: 22px; font-family: "JetBrains Mono", Consolas, monospace; font-size: 12.6px; letter-spacing: 0.04em; color: var(--ink-3); min-height: 1.6em; }
    .status.is-live { color: #2ad4b1; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); margin-right: 8px; vertical-align: middle; animation: pulse 1.8s ease-in-out infinite; }
    .is-live .dot { background: #2ad4b1; animation: none; }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } .btn { transition: none; } }
    @media (max-width: 480px) { .actions .btn { width: 100%; } }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <div class="limb" aria-hidden="true"></div>
  <main>
    <div class="card">
      <a class="brand" href="/"><img src="/assets/logo.svg" alt="" width="28" height="28">Assignment Monitor</a>
      <p class="mono">Offline</p>
      <h1>No connection.</h1>
      <p>This page needs the internet to load. Assignment Monitor on your PC keeps watching the portal without it and catches up on its own when you are back.</p>
      <div class="actions">
        <button class="btn btn-accent" type="button" id="retry">Try again</button>
        <a class="btn btn-ghost" href="/">Home</a>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span>Waiting for a connection. The page reloads by itself.</p>
    </div>
  </main>
  <script src="/offline.js"></script>
</body>
</html>
