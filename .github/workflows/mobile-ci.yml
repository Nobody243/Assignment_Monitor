name: Phone app

on:
  push:
    paths: ["mobile/**", "summary.py", "tools/dart_*.py", "tools/make_mobile_*.py", ".github/workflows/mobile-ci.yml"]
  pull_request:
    paths: ["mobile/**", "summary.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Tests with coverage (contract, layout at large text, contrast, screens, model)
        run: flutter test --coverage
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coverage floor
        working-directory: .
        run: python tools/dart_coverage.py --min 70
      - name: Known vulnerabilities in the locked packages (osv.dev)
        working-directory: .
        run: python tools/dart_osv_check.py
      - name: Build a debug-signed APK (a test build, not for the Play Store)
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: assignment-monitor-phone-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  ios:
    # Compile check for iOS on a Mac runner, without signing. It cannot be installed (that needs an Apple developer
    # account), and iOS has not been run on a device: treat a red here as a reminder to look, not a blocker, until then.
    runs-on: macos-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
