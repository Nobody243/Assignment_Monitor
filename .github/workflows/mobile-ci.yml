name: Phone app

on:
  push:
    paths: ["mobile/**", "summary.py", ".github/workflows/mobile-ci.yml"]
  pull_request:
    paths: ["mobile/**", "summary.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build a debug-signed APK (a test build, not for the Play Store)
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: assignment-monitor-phone-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
