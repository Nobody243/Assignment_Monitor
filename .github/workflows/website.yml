name: Website

# The app workflow (build.yml) skips website-only commits on purpose: it builds a Windows installer.
# This one covers the site: every push or pull request that touches website/ must install, build and pass a
# smoke test of the built bundle (routes, download links, no missing assets) before Vercel's deploy is trusted.
on:
  push:
    branches: ["main"]
    paths: ["website/**", ".github/workflows/website.yml", ".github/scripts/site-smoke.mjs"]
  pull_request:
    paths: ["website/**", ".github/workflows/website.yml", ".github/scripts/site-smoke.mjs"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Smoke test the built site
        run: |
          set -e
          test -f dist/index.html
          test -f dist/draco/draco_decoder.wasm
          test -f dist/assets/ascend/planet.glb
          # every hashed bundle referenced by index.html must exist
          for f in $(grep -o '/bundle/[^"]*' dist/index.html | sort -u); do test -f "dist$f" || { echo "missing $f"; exit 1; }; done
          # the SPA fallback and security headers are configured
          node -e "const v=require('./vercel.json'); if(!v.rewrites?.length) throw new Error('no SPA rewrite'); if(!JSON.stringify(v.headers).includes('Content-Security-Policy')) throw new Error('no CSP')"
          echo "bundle sizes:"; du -h dist/bundle/* | sort -h
      - name: Routes render (headless Chromium)
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
          (npm run preview -- --host 127.0.0.1 >/tmp/preview.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node ../.github/scripts/site-smoke.mjs
