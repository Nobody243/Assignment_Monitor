name: Test and build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest
      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest   # ships with Inno Setup 6, so build.py also produces the installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Build app, portable zip and installer
        run: python build.py
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AssignmentMonitor-windows
          path: |
            dist/AssignmentMonitor-Setup.exe
            dist/AssignmentMonitor-portable.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AssignmentMonitor-Setup.exe
            dist/AssignmentMonitor-portable.zip
          generate_release_notes: true
