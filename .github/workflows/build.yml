name: Test, build and release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths-ignore: ["website/**", "*.md", ".github/workflows/website.yml", ".github/workflows/portal-probe.yml", ".github/workflows/install-test.yml", ".github/scripts/**"]
  pull_request:
    paths-ignore: ["website/**", "*.md", ".github/workflows/website.yml", ".github/workflows/portal-probe.yml", ".github/workflows/install-test.yml", ".github/scripts/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  build:
    # every commit on main and every version tag produces the installer and the portable zip
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest   # ships with Inno Setup 6, so build.py also produces the installer
    env:
      # Code signing (SignPath Foundation) switches on automatically once the two secrets exist.
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' && secrets.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Build app, portable zip and installer
        run: python build.py

      - name: Upload unsigned build artifacts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: AssignmentMonitor-windows-${{ github.sha }}
          path: |
            dist/AssignmentMonitor-Setup.exe
            dist/AssignmentMonitor-portable.zip

      # ---- code signing: numbered releases only, and only when SignPath is configured
      - name: Submit release to SignPath for signing
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: Assignment_Monitor
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed
      - name: Use signed files for the release
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_SIGNPATH == 'true'
        shell: bash
        run: |
          ls -R dist/signed
          cp -f dist/signed/AssignmentMonitor-Setup.exe dist/AssignmentMonitor-Setup.exe
          cp -f dist/signed/AssignmentMonitor-portable.zip dist/AssignmentMonitor-portable.zip
          echo "SIGNED_NOTE=Signed with a SignPath Foundation certificate (see CODE_SIGNING_POLICY.md)." >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG.md (version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          # the section for this tag (between its "## x.y.z" heading and the next one)
          awk -v ver="${GITHUB_REF_NAME#v}" '/^## /{p = index($0, "## " ver " ") == 1 || $0 == "## " ver} p' CHANGELOG.md > dist/notes.md
          [ -s dist/notes.md ] || echo "## ${GITHUB_REF_NAME}" > dist/notes.md
          cat dist/notes.md

      - name: Publish numbered release (version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AssignmentMonitor-Setup.exe
            dist/AssignmentMonitor-portable.zip
          body_path: dist/notes.md
          append_body: true
          generate_release_notes: true
          body: |
            **Download:** `AssignmentMonitor-Setup.exe` (installer, recommended) or `AssignmentMonitor-portable.zip`.
            ${{ env.SIGNED_NOTE }}

            Code signing policy: free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org). See [CODE_SIGNING_POLICY.md](https://github.com/${{ github.repository }}/blob/main/CODE_SIGNING_POLICY.md).

      - name: Tell the website about the release (version tags)
        # website/public/latest.json is what the site shows (version, date, sizes, links) without asking GitHub's
        # API from every visitor's browser. Committing it to main makes Vercel rebuild the site; build.yml itself
        # ignores website-only commits, so this cannot loop.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          python - <<'PY'
          import datetime, json, os
          tag = os.environ["GITHUB_REF_NAME"]
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases"
          info = {
              "version": tag.lstrip("v"), "tag": tag,
              "published_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "page_url": f"{base}/tag/{tag}",
              "setup_url": f"{base}/download/{tag}/AssignmentMonitor-Setup.exe",
              "setup_size": os.path.getsize("dist/AssignmentMonitor-Setup.exe"),
              "zip_url": f"{base}/download/{tag}/AssignmentMonitor-portable.zip",
              "zip_size": os.path.getsize("dist/AssignmentMonitor-portable.zip"),
          }
          with open("latest.json", "w", encoding="utf-8") as f:
              f.write(json.dumps(info, indent=2) + "\n")
          PY
          git config user.name "Nobody243"
          git config user.email "Nobody243@users.noreply.github.com"
          git fetch --depth=1 origin main
          git checkout -B main origin/main
          mv -f latest.json website/public/latest.json
          git add website/public/latest.json
          git commit -m "Website: the latest release is ${GITHUB_REF_NAME} (written by the release build)" || exit 0
          git push origin main

      - name: Refresh rolling "latest" pre-release (every commit on main)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            dist/AssignmentMonitor-Setup.exe dist/AssignmentMonitor-portable.zip \
            --prerelease --title "Latest build (main)" \
            --notes "Automatic, unsigned build of commit ${GITHUB_SHA::7}. For the stable version use the newest numbered release. The app's update check only looks at numbered releases."
