name: Portal probe (feasibility)

# One-off: does the university portal accept a sign-in from a GitHub runner? Needs the repository secrets
# PORTAL_ENROLLMENT and PORTAL_PASSWORD. Prints pass/fail and counts only.
# Manual only: path filters are ignored for tag pushes, so a push trigger would run it on every release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and the parser
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.64.0 lxml==6.1.3
          python -m playwright install --with-deps chromium
      - name: Runner's public address (region check)
        run: curl -s https://ipinfo.io/json | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('country'), d.get('region'), d.get('org'))"
      - name: Sign in and count
        env:
          PORTAL_ENROLLMENT: ${{ secrets.PORTAL_ENROLLMENT }}
          PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
        run: python .github/scripts/portal_probe.py
