name: Phone app release

# A signed Android build of the phone app. Run from the Actions tab (Run workflow) or push a tag named phone-v1.0.0.
# Needs four repository secrets (see mobile/RELEASE.md): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Without them the run stops with a clear message instead of signing with a
# debug key. Desktop releases use tags named v*, which this tag pattern does not match.
on:
  push:
    tags: ["phone-v*"]
  workflow_dispatch:
    inputs:
      minify:
        description: "Shrink the code with R8 (try on a phone before publishing)"
        type: boolean
        default: false
      publish:
        description: "Publish the release (the automatic release does); otherwise it is a draft to review first"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      MINIFY: ${{ github.event_name == 'workflow_dispatch' && inputs.minify || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - name: The signing secrets are there
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE STORE_PASSWORD ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing the secret for $v. See mobile/RELEASE.md."; exit 1; fi
          done
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          # pinned to the version the app is developed and tested with; a newer stable can add lints (it already deprecates
          # material.dart for material_ui) and turn a build red for a reason unrelated to the change. Raise it on purpose.
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Write the signing key (only in this job's temporary workspace)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/app/upload.jks
          {
            echo "storeFile=app/upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - name: Build the signed APK and the Play bundle
        run: |
          flutter build apk --release --build-number=${{ github.run_number }} -Pminify=$MINIFY
          flutter build appbundle --release --build-number=${{ github.run_number }} -Pminify=$MINIFY
      - name: Remove the signing key
        if: always()
        run: rm -f android/key.properties android/app/upload.jks
      - name: Checksums
        run: |
          cd build/app/outputs
          cp flutter-apk/app-release.apk AssignmentMonitor-phone.apk
          cp bundle/release/app-release.aab AssignmentMonitor-phone.aab
          sha256sum AssignmentMonitor-phone.apk AssignmentMonitor-phone.aab > AssignmentMonitor-phone.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: assignment-monitor-phone-release
          path: |
            mobile/build/app/outputs/AssignmentMonitor-phone.apk
            mobile/build/app/outputs/AssignmentMonitor-phone.aab
            mobile/build/app/outputs/AssignmentMonitor-phone.sha256
          retention-days: 30
      - name: Release notes from mobile/CHANGELOG.md (phone version tags)
        if: startsWith(github.ref, 'refs/tags/phone-v')
        working-directory: .
        run: |
          awk -v ver="${GITHUB_REF_NAME#phone-v}" '/^## /{p = index($0, "## " ver " ") == 1 || $0 == "## " ver} p' mobile/CHANGELOG.md > phone-notes.md 2>/dev/null || true
          [ -s phone-notes.md ] || echo "## ${GITHUB_REF_NAME}" > phone-notes.md
      - name: Publish the release, or attach to a draft (phone version tags)
        if: startsWith(github.ref, 'refs/tags/phone-v')
        uses: softprops/action-gh-release@v2
        with:
          # a run started by hand on a tag, or by the automatic release, publishes when "publish" is on; a pushed tag stays a draft
          draft: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish) }}
          prerelease: false
          # the repository's "latest release" is the desktop app's: its in-app updater and the website's download link follow it
          make_latest: false
          body_path: phone-notes.md
          name: Phone app ${{ github.ref_name }}
          files: |
            mobile/build/app/outputs/AssignmentMonitor-phone.apk
            mobile/build/app/outputs/AssignmentMonitor-phone.aab
            mobile/build/app/outputs/AssignmentMonitor-phone.sha256

      - name: Tell the website about the phone release (published releases only)
        # website/public/phone.json is what the site's Android page shows (version, size, links) without asking GitHub's
        # API from every visitor's browser. It lives under website/, which neither phone workflow watches, so no loop.
        if: startsWith(github.ref, 'refs/tags/phone-v') && github.event_name == 'workflow_dispatch' && inputs.publish
        working-directory: .
        shell: bash
        run: |
          python - <<'PY'
          import datetime, json, os
          tag = os.environ["GITHUB_REF_NAME"]
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases"
          apk = "mobile/build/app/outputs/AssignmentMonitor-phone.apk"
          info = {
              "version": tag.removeprefix("phone-v"), "tag": tag,
              "published_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "page_url": f"{base}/tag/{tag}",
              "apk_url": f"{base}/download/{tag}/AssignmentMonitor-phone.apk",
              "apk_size": os.path.getsize(apk),
              "sha_url": f"{base}/download/{tag}/AssignmentMonitor-phone.sha256",
          }
          with open("phone.json", "w", encoding="utf-8") as f:
              f.write(json.dumps(info, indent=2) + "\n")
          PY
          git config user.name "Nobody243"
          git config user.email "Nobody243@users.noreply.github.com"
          git fetch --depth=1 origin main
          git checkout -B main origin/main
          mv -f phone.json website/public/phone.json
          git add website/public/phone.json
          git commit -m "Website: the latest phone app is ${GITHUB_REF_NAME} (written by the release build)" || exit 0
          git push origin main
