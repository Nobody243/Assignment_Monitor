# Assignment Monitor cloud checks. Written by the app; it is replaced on every app update, so edits here are lost.
# Runs the same check the PC runs, on GitHub's machines, so alerts reach the phone and the mailbox when the PC is off.
name: Assignment Monitor check

on:
  schedule:
    - cron: "43 2 * * *"    # 07:43 Pakistan time (an odd minute: GitHub starts top-of-the-hour jobs hours late)
    - cron: "37 13 * * *"   # 18:37 Pakistan time
  workflow_dispatch:
    inputs:
      mode:
        description: "check (full sync and alerts) or verify (sign in, count, send a test alert)"
        default: check
        type: choice
        options: [check, verify]

permissions:
  contents: write

env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/browsers

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: This repository (state)
        uses: actions/checkout@v4
      - name: Assignment Monitor 1.9.0
        uses: actions/checkout@v4
        with:
          repository: Nobody243/Assignment_Monitor
          ref: v1.9.0
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet playwright==1.64.0 lxml==6.1.3 pywebpush==2.5.0
          python -m playwright install --with-deps chromium
      - name: Check
        env:
          ASSIGNMENT_MONITOR_HOME: ${{ github.workspace }}/state
          ASSIGNMENT_MONITOR_RUNNER: cloud
          AM_ENABLE_WINDOWS_TOAST: "False"
          AM_ENABLE_VOICE: "False"
          AM_HEADLESS: "True"
          AM_INSTITUTE_ID: "1"
          AM_NOTIFY_DAYS_AHEAD: "3"
          AM_ATTENDANCE_MIN: "75"
          AM_EXAM_REMIND_DAYS: "1"
          AM_TRACK_ATTENDANCE: "True"
          AM_TRACK_EXAMS: "True"
          AM_TRACK_ANNOUNCEMENTS: "True"
          AM_TRACK_LECTURES: "True"
          AM_TRACK_TIMETABLE: "True"
          AM_TRACK_RESULTS: "True"
          AM_PUSH_ENABLED: "False"
          AM_EMAIL_ENABLED: "False"
          AM_EMAIL_TO: ""
          AM_EMAIL_USER: ""
          AM_EMAIL_HOST: ""
          AM_EMAIL_PORT: "587"
          AM_ENROLLMENT: ${{ secrets.AM_ENROLLMENT }}
          AM_PASSWORD: ${{ secrets.AM_PASSWORD }}
          AM_PUSH_SUB: ${{ secrets.AM_PUSH_SUB }}
          AM_PUSH_VAPID: ${{ secrets.AM_PUSH_VAPID }}
          AM_EMAIL_PASS: ${{ secrets.AM_EMAIL_PASS }}
        run: python app/cloud_check.py ${{ inputs.mode || 'check' }}
      - name: Save state
        # every run commits (at least the timestamp): GitHub switches off the schedule of a repository that has
        # had no commits for 60 days, which a quiet semester break would otherwise trigger
        if: always()
        run: |
          git config user.name "Assignment Monitor"
          git config user.email "noreply@users.noreply.github.com"
          date -u +%Y-%m-%dT%H:%MZ > state/last_run.txt
          git add state
          git diff --cached --quiet || (git commit -q -m "state $(date -u +%Y-%m-%dT%H:%MZ)" && git push -q)
